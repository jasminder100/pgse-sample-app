appName: pgse-sample-app
repositoryUrl: https://github.com/jasminder100/pgse-sample-app

image:
  repository: pgseacrjs2026.azurecr.io/pgse-sample-app
  tag: "1.0.1"          # release version: bump this to deploy

replicaCount: 2         # rule 16: prod needs >= 2
containerPort: 8080

ownershipLabels:        # rules 14, 15
  owner: platform-team
  team: pgse
  cost-center: cc-1001
  environment: prod

resources:              # rule 8
  requests: {cpu: 50m, memory: 32Mi}
  limits:   {cpu: 100m, memory: 64Mi}

pdb:
  minAvailable: 1       # rule 11

keyVault:               # secrets come from Azure Key Vault via the CSI driver (SecretProviderClass)
  enabled: true
  name: pgse-kv-js2026
  tenantId: 4ac50105-0c66-404e-a107-7cbd8a9a6442
  clientId: 7d79dcb7-4350-4fd7-878f-39e4ba0e0026   # managed identity id-pgse-sample-app (an ID, not a secret)
  mountPath: /mnt/secrets-store
  secrets:
    - db-password
