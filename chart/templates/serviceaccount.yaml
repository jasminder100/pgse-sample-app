apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}
  {{- if .Values.keyVault.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.keyVault.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false   # rule 25: no API token in the pod; the CSI driver requests its own
