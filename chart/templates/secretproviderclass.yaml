{{- if .Values.keyVault.enabled }}
# Tells the Key Vault CSI driver what to mount: which vault, which secrets, using which identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.appName }}-kv
  namespace: {{ .Release.Namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.keyVault.clientId | quote }}   # workload identity (federated with this SA)
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ . }}
          objectType: secret
      {{- end }}
{{- end }}
