name: ci-gate

# Renders the Helm chart exactly as Argo CD will, then checks the rendered manifests
# with gator (PGSE policies, source of truth) and Checkov (shift-left baseline).
# Each run records CI metrics (latency, pass/fail, violations by rule) as the ci-metrics artifact.

on:
  pull_request:
  push:
    branches: [main]

env:
  GATOR_VERSION: v3.19.1
  CHECKOV_VERSION: 3.3.29
  HELM_VERSION: v3.22.0
  # Checkov checks mapped to PGSE deny-mode rules. Each ID was verified to (1) catch the rule's
  # disallowed sample and (2) pass compliant workloads. gator remains the source of truth.
  #   P01 16 | P02 23 | P03 20 | P04 17,18,19 | P05 22 | P06 28,37,39 | P08 10-13
  #   P09 14 | P12 8,9 | P22 31 | P23 26 | P25 38
  # No Checkov equivalent (gator only): P10, P19, P20, P24.
  # Excluded: CKV_K8S_25 (flags NET_BIND_SERVICE, which P06 allows: false positive).
  CHECKOV_CHECKS: CKV_K8S_16,CKV_K8S_23,CKV_K8S_20,CKV_K8S_17,CKV_K8S_18,CKV_K8S_19,CKV_K8S_22,CKV_K8S_28,CKV_K8S_37,CKV_K8S_39,CKV_K8S_10,CKV_K8S_11,CKV_K8S_12,CKV_K8S_13,CKV_K8S_14,CKV_K8S_8,CKV_K8S_9,CKV_K8S_31,CKV_K8S_26,CKV_K8S_38

jobs:
  gator:
    name: gator
    runs-on: ubuntu-latest
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4

      - name: Check out policy repo (main)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pgse-policies
          ref: main
          path: policies-repo

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint and render the chart (same as Argo CD)
        run: |
          set -euo pipefail
          helm lint chart
          mkdir -p rendered
          helm template pgse-sample-app chart -n demo > rendered/pgse-sample-app.yaml
          echo "Rendered manifests:"; cat rendered/pgse-sample-app.yaml

      - name: Install gator
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/open-policy-agent/gatekeeper/releases/download/${GATOR_VERSION}/gator-${GATOR_VERSION}-linux-amd64.tar.gz" | tar xz -C "$HOME/bin" gator
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check rendered chart against PGSE policies
        run: |
          set +e -uo pipefail   # keep going on failure: we capture the exit code ourselves
          ARGS=()
          while IFS= read -r f; do ARGS+=(-f "$f"); done < <(find policies-repo/policies -name template.yaml -o -name constraint.yaml | sort)
          N=$(( ${#ARGS[@]} / 2 ))
          echo "Loaded $N policy files from pgse-policies"
          [ "$N" -gt 0 ] || { echo "::error::No policy files found - refusing to pass"; exit 1; }
          NS_ARGS=(); [ -d policies-repo/namespaces ] && NS_ARGS=(-f policies-repo/namespaces)

          START=$(date +%s%3N)
          gator test "${ARGS[@]}" "${NS_ARGS[@]}" -f rendered/ </dev/null > gator.out 2>&1
          RC=$?
          END=$(date +%s%3N)
          cat gator.out

          # Metrics: one line per violation, rule id = the [Pxx] tag in the message
          VIOL=$(grep -c '\[P[0-9][0-9]\]' gator.out || true)
          BYRULE=$(grep -o '\[P[0-9][0-9]\]' gator.out | tr -d '[]' | sort | uniq -c \
                   | awk 'BEGIN{printf "{"} {printf "%s\"%s\":%s", (NR>1?",":""), $2, $1} END{printf "}"}')
          PASSED=$([ "$RC" -eq 0 ] && echo true || echo false)
          mkdir -p metrics
          printf '{"tool":"gator","durationMs":%s,"exitCode":%s,"passed":%s,"violations":%s,"byRule":%s}\n' \
            "$((END-START))" "$RC" "$PASSED" "${VIOL:-0}" "$BYRULE" > metrics/gator.json
          cat metrics/gator.json
          exit "$RC"

      - name: Upload gator metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-gator
          path: metrics/gator.json
          if-no-files-found: ignore

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Render the chart (same as Argo CD)
        run: |
          set -euo pipefail
          mkdir -p rendered
          helm template pgse-sample-app chart -n demo > rendered/pgse-sample-app.yaml

      - name: Install Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Scan rendered chart
        run: |
          set +e -uo pipefail   # keep going on failure: we capture the exit code ourselves
          START=$(date +%s%3N)
          checkov -d rendered --framework kubernetes --check "$CHECKOV_CHECKS" --skip-download -o json > checkov.json 2>/dev/null
          RC=$?
          END=$(date +%s%3N)

          # Readable result in the log: one line per failure, with file and line range
          jq -r 'if type=="array" then .[] else . end | .results.failed_checks[]?
                 | "FAILED \(.check_id) \(.file_path):\(.file_line_range[0])-\(.file_line_range[1])  \(.check_name)"' checkov.json || true
          jq -r 'if type=="array" then .[] else . end | "Passed: \(.summary.passed)  Failed: \(.summary.failed)"' checkov.json || true

          # Metrics
          FAILED=$(jq '[if type=="array" then .[] else . end | .summary.failed] | add // 0' checkov.json 2>/dev/null || echo 0)
          BYCHECK=$(jq -c '[if type=="array" then .[] else . end | .results.failed_checks[]?.check_id]
                           | group_by(.) | map({(.[0]): length}) | add // {}' checkov.json 2>/dev/null || echo '{}')
          PASSED=$([ "$RC" -eq 0 ] && echo true || echo false)
          mkdir -p metrics
          printf '{"tool":"checkov","durationMs":%s,"exitCode":%s,"passed":%s,"violations":%s,"byCheck":%s}\n' \
            "$((END-START))" "$RC" "$PASSED" "$FAILED" "$BYCHECK" > metrics/checkov.json
          cat metrics/checkov.json
          exit "$RC"

      - name: Upload checkov metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-checkov
          path: metrics/checkov.json
          if-no-files-found: ignore

  metrics:
    name: metrics
    needs: [gator, checkov]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download job metrics
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics

      - name: Combine and summarize
        run: |
          ls metrics/*.json >/dev/null 2>&1 || { echo "No metrics produced"; exit 0; }
          jq -s \
            --arg runId "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF_NAME" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg timestamp "$(date -u +%FT%TZ)" \
            '{runId:$runId, sha:$sha, event:$event, ref:$ref, pr:$pr, timestamp:$timestamp, tools:.}' \
            metrics/*.json > ci-metrics.json
          cat ci-metrics.json
          {
            echo "### PGSE CI metrics"
            echo ""
            echo "| Tool | Result | Duration | Violations | By rule / check |"
            echo "|---|---|---|---|---|"
            jq -r '.tools[] | "| \(.tool) | \(if .passed then " pass" else " fail" end) | \(.durationMs) ms | \(.violations) | \((.byRule // .byCheck) | tostring) |"' ci-metrics.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined metrics
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: ci-metrics.json
