name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "k8s/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

permissions:
  id-token: write          # lets the job request a GitHub OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NAMESPACE: demo
  IMAGE_REPO: pgse-sample-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC (managed identity, no stored keys)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image (tagged with commit SHA)
        id: image
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_REPO}:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up kubelogin (AKS uses Entra ID)
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: latest

      - name: Connect kubectl to AKS as the deploy identity
        run: |
          az aks get-credentials -g "${{ vars.AZURE_RG }}" -n "${{ vars.AKS_NAME }}" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Prove least privilege (RBAC via Entra group pgse-deployers)
        run: |
          check() { printf '%-45s %s\n' "$*" "$(kubectl auth can-i "$@" 2>/dev/null || true)"; }
          check create deployments -n demo        # expected: yes
          check create poddisruptionbudgets -n demo # expected: yes
          check get secrets -n demo               # expected: no
          check create deployments -n dev         # expected: no
          check delete constraints --all-namespaces # expected: no
          check create clusterrolebindings        # expected: no

      - name: Point manifest at the new image
        run: |
          sed "s|image: .*|image: ${{ steps.image.outputs.image }}|" k8s/deployment.yaml > /tmp/deployment.yaml
          grep -n "image:" /tmp/deployment.yaml

      - name: Apply to AKS (Gatekeeper checks it here)
        run: kubectl apply -f k8s/pdb.yaml -f /tmp/deployment.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/pgse-sample-app -n "$NAMESPACE" --timeout=180s

      - name: Summary
        if: always()
        run: kubectl get deployment,pods -n "$NAMESPACE" -l app=pgse-sample-app -o wide || true
