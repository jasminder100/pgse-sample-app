apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgse-sample-app
  namespace: demo
  labels:
    app: pgse-sample-app
    owner: platform-team
    team: pgse
    cost-center: cc-1001
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgse-sample-app
  template:
    metadata:
      labels:
        app: pgse-sample-app
    spec:
      automountServiceAccountToken: false                    # rule 25
      securityContext:
        seccompProfile:                                      # rule 22
          type: RuntimeDefault
      containers:
        - name: web
          image: 563675986491.dkr.ecr.ap-south-1.amazonaws.com/mirror/nginx-unprivileged:1.27.0-alpine   # rule 9: pinned tag
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false                                # rule 1
            allowPrivilegeEscalation: false                  # rule 3
            runAsNonRoot: true                               # rule 2
            runAsUser: 101                                   # rule 2
            readOnlyRootFilesystem: true                     # rule 5
            capabilities:                                    # rule 6
              drop: ["ALL"]
          resources:                                         # rule 8
            requests: {cpu: 50m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 64Mi}
          readinessProbe:                                    # rule 12
            httpGet: {path: /, port: 8080}
          livenessProbe:                                     # rule 12
            httpGet: {path: /, port: 8080}
          volumeMounts:                                      # rule 5: writable /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
