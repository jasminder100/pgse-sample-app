apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgse-sample-app
  namespace: demo
  labels:
    app: pgse-sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgse-sample-app
  template:
    metadata:
      labels:
        app: pgse-sample-app
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27.0-alpine   # rule 9: pinned tag
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false                                # rule 1
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
          resources:                                         # rule 8
            requests: {cpu: 50m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
